name: Diablo adapter package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version to embed in game-host-adapter.json
        required: true
        default: 0.1.0
        type: string
  push:
    tags:
      - 'godevilution-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out Godevilution
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build and stage the Diablo adapter package
        shell: pwsh
        run: |
          $version = '${{ inputs.package_version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:GITHUB_REF_NAME -replace '^godevilution-v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Package version '$version' is not semantic major.minor.patch."
          }
          $stage = Join-Path $env:RUNNER_TEMP 'godevilution-diablo-package'
          $archive = Join-Path $env:RUNNER_TEMP ("godevilution-diablo-adapter-$version.zip")
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./tools/package-diablo-adapter.ps1 `
            -OutputRoot $stage `
            -Configuration Release `
            -PackageVersion $version `
            -ArchivePath $archive

      - name: Verify the distributable archive
        shell: pwsh
        run: |
          ./tools/verify-diablo-adapter-archive.ps1 `
            -ArchivePath $env:PACKAGE_ARCHIVE `
            -ExpectedPackageId godevilution.diablo.package `
            -ExpectedPackageVersion $env:PACKAGE_VERSION `
            -SharedContractRoot ./server/src/Devilution.Server/bin/Release/net10.0

      - name: Upload the verified package
        uses: actions/upload-artifact@v4
        with:
          name: godevilution-diablo-adapter-${{ env.PACKAGE_VERSION }}
          path: ${{ env.PACKAGE_ARCHIVE }}
          if-no-files-found: error
