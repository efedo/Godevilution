name: Authoritative Replay Parity

on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-parity:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - name: Install native test dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake curl g++ git libbz2-dev libfmt-dev libgmock-dev libgtest-dev libpng-dev libsodium-dev libsdl2-dev libprotobuf-dev protobuf-compiler ninja-build wget

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        # Most managed projects target net8.0; the server host targets net10.0.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Verify shared replay fixture registration
      shell: bash
      run: |
        find test/fixtures/replay -type f -name '*.json' -printf '%P\n' | sort > /tmp/replay-fixtures.expected
        grep -oE 'replay/[^[:space:]"<]+\.json' test/Fixtures.cmake | sed 's#^replay/##' | sort > /tmp/replay-fixtures.native
        grep -oE 'replay/[^[:space:]"<]+\.json' server/tests/Devilution.Server.Tests/Devilution.Server.Tests.csproj | sed 's#^replay/##' | sort > /tmp/replay-fixtures.server
        diff -u /tmp/replay-fixtures.expected /tmp/replay-fixtures.native
        diff -u /tmp/replay-fixtures.expected /tmp/replay-fixtures.server

    - name: Verify shipped content contract documentation
      run: python3 tools/validate_content_contract.py

    - name: Configure native replay runner
      run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF

    - name: Download native test asset
      run: wget -qnc https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq -P build

    - name: Build native replay runner
      run: cmake --build build --target replay_test -j 2

    - name: Run native replay fixtures
      working-directory: build
      run: ./replay_test --gtest_color=yes

    - name: Configure native authoritative-mode tests
      run: cmake -S . -B build-authoritative -G Ninja -DBUILD_TESTING=ON -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF -DDEVILUTIONX_ENABLE_SERVER_BACKED_CLIENT=ON

    - name: Build native authoritative-mode tests
      run: cmake --build build-authoritative --target server_backed_client_test server_backed_configuration_test server_backed_vendor_ui_test -j 2

    - name: Run native authoritative-mode tests
      run: |
        ./build-authoritative/server_backed_client_test --gtest_color=yes
        ./build-authoritative/server_backed_configuration_test --gtest_color=yes
        ./build-authoritative/server_backed_vendor_ui_test --gtest_color=yes

    - name: Run managed architecture boundary tests
      run: |
        dotnet run --project server/tests/Devilution.Domain.Tests/Devilution.Domain.Tests.csproj --configuration Release
        dotnet run --project server/tests/Devilution.Data.Tests/Devilution.Data.Tests.csproj --configuration Release
        dotnet run --project server/tests/Devilution.Engine.Tests/Devilution.Engine.Tests.csproj --configuration Release
        dotnet run --project server/tests/Devilution.Diablo.Tests/Devilution.Diablo.Tests.csproj --configuration Release

    - name: Restore authoritative server tests
      run: dotnet restore server/tests/Devilution.Server.Tests/Devilution.Server.Tests.csproj

    - name: Build authoritative server tests
      run: dotnet build server/tests/Devilution.Server.Tests/Devilution.Server.Tests.csproj --configuration Release --no-restore

    - name: Run authoritative server replay fixtures
      run: dotnet run --project server/tests/Devilution.Server.Tests/Devilution.Server.Tests.csproj --configuration Release --no-build

    - name: Restore authoritative protocol client tests
      run: dotnet restore godot-client/Devilution.Client.Protocol.Tests/Devilution.Client.Protocol.Tests.csproj

    - name: Build authoritative protocol client tests
      run: dotnet build godot-client/Devilution.Client.Protocol.Tests/Devilution.Client.Protocol.Tests.csproj --configuration Release --no-restore

    - name: Run authoritative client/server smoke tests
      run: dotnet run --project godot-client/Devilution.Client.Protocol.Tests/Devilution.Client.Protocol.Tests.csproj --configuration Release --no-build
