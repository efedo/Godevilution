syntax = "proto3";

package devilution.protocol.v1;

option csharp_namespace = "Devilution.Protocol.V1";

// The wire transport is intentionally outside this schema. The initial
// implementation uses TCP with a length-delimited Envelope payload.
message Envelope {
	oneof payload {
		ClientHello client_hello = 10;
		ServerHello server_hello = 11;
		CommandBatch command_batch = 20;
		CommandAck command_ack = 21;
		Snapshot snapshot = 30;
		EventBatch event_batch = 31;
		SnapshotRequest snapshot_request = 32;
		TimingReply timing_reply = 33;
		ProtocolError error = 40;
	}

	// Requests the latest authoritative state. Clock-gated clients also probe
	// startup readiness before dispatching queued realtime input.
	message SnapshotRequest {
		// Optional correlation for clock-gated clients; zero requests state only.
		uint64 timing_request_id = 1;
	}
}

// Sent after the correlated snapshot, measuring end-to-end state freshness
// without including deliberately scheduled future-command acknowledgement waits.
message TimingReply {
	uint64 request_id = 1;
}

message ClientHello {
	string client_build_id = 1;
	string protocol_schema_version = 2;
	string content_manifest_hash = 3;
	string resume_token = 4;
	// Optional additive identity for clients that understand ruleset hashes.
	string ruleset_identity_hash = 5;
	// New sessions may request a stable class/archetype ID from active content.
	// Resumed authoritative state takes precedence over this selection.
	optional uint32 requested_character_class_id = 6;
	// Optional native-compatible character identity for a new participant.
	// Resumed server-owned state takes precedence over this selection.
	optional string requested_character_name = 7;
	// Explicit support for deferred future-command acknowledgements and timing probes.
	bool supports_clock_gated_commands = 8;
}

message ServerHello {
	string server_build_id = 1;
	string protocol_schema_version = 2;
	string content_manifest_hash = 3;
	uint32 tick_rate_hz = 4;
	string session_token = 5;
	string ruleset_identity_hash = 6;
	GameMode game_mode = 7;
	// Additive resume metadata. Fresh clients allocate above completed and, in
	// gated mode, admitted pending sequences. Retries retain original identities;
	// queued intents themselves are not durable across host restart.
	optional uint64 last_client_sequence = 8;
	CommandSchedulingMode command_scheduling_mode = 9;
}

enum CommandSchedulingMode {
	COMMAND_SCHEDULING_MODE_UNSPECIFIED = 0;
	COMMAND_SCHEDULING_MODE_IMMEDIATE = 1;
	COMMAND_SCHEDULING_MODE_CLOCK_GATED = 2;
}

enum GameMode {
	GAME_MODE_UNSPECIFIED = 0;
	GAME_MODE_SINGLE_PLAYER = 1;
	GAME_MODE_MULTIPLAYER = 2;
}

// Semantic role of the content-owned class skill, independent of its stable
// spell identity. Clients use this for presentation and typed service intents.
enum PlayerAbilityKind {
	PLAYER_ABILITY_KIND_UNSPECIFIED = 0;
	PLAYER_ABILITY_KIND_REPAIR = 1;
	PLAYER_ABILITY_KIND_TRAP_DISARM = 2;
	PLAYER_ABILITY_KIND_RECHARGE = 3;
	PLAYER_ABILITY_KIND_SEARCH = 4;
	PLAYER_ABILITY_KIND_IDENTIFY = 5;
	PLAYER_ABILITY_KIND_RAGE = 6;
}

// Server-projected classification for item-backed spell sources. The client
// must not infer this from native miscellaneous IDs.
enum ItemSpellSourceKind {
	ITEM_SPELL_SOURCE_KIND_UNSPECIFIED = 0;
	ITEM_SPELL_SOURCE_KIND_CHARGED_ITEM = 1;
	ITEM_SPELL_SOURCE_KIND_CONSUMABLE_ITEM = 2;
}

// Server-projected semantic action supplied by an item, independent of spells.
enum ItemActionKind {
	ITEM_ACTION_KIND_UNSPECIFIED = 0;
	ITEM_ACTION_KIND_IDENTIFY = 1;
	ITEM_ACTION_KIND_READ_BOOK = 2;
	ITEM_ACTION_KIND_RESTORE_PARTIAL_LIFE = 3;
	ITEM_ACTION_KIND_RESTORE_FULL_LIFE = 4;
	ITEM_ACTION_KIND_RESTORE_PARTIAL_MANA = 5;
	ITEM_ACTION_KIND_RESTORE_FULL_MANA = 6;
	ITEM_ACTION_KIND_RESTORE_PARTIAL_LIFE_AND_MANA = 7;
	ITEM_ACTION_KIND_RESTORE_FULL_LIFE_AND_MANA = 8;
	ITEM_ACTION_KIND_INCREASE_STRENGTH = 9;
	ITEM_ACTION_KIND_INCREASE_MAGIC = 10;
	ITEM_ACTION_KIND_INCREASE_DEXTERITY = 11;
	ITEM_ACTION_KIND_INCREASE_VITALITY = 12;
	ITEM_ACTION_KIND_INCREASE_ALL_ATTRIBUTES = 13;
	ITEM_ACTION_KIND_APPLY_BLACKSMITH_OIL = 14;
	ITEM_ACTION_KIND_APPLY_ACCURACY_OIL = 15;
	ITEM_ACTION_KIND_APPLY_SHARPNESS_OIL = 16;
	ITEM_ACTION_KIND_APPLY_FORTITUDE_OIL = 17;
	ITEM_ACTION_KIND_OPEN_CATHEDRAL_MAP = 18;
	ITEM_ACTION_KIND_READ_QUEST_NOTE = 19;
}

message CommandBatch {
	repeated Command commands = 1;
}

message Command {
	// Retried commands reuse this value. The server deduplicates by session and
	// client_sequence, then returns the original result for a duplicate.
	uint64 client_sequence = 1;
	uint64 requested_tick = 2;
	oneof intent {
		MoveRequested move_requested = 10;
		AttackRequested attack_requested = 11;
		CastRequested cast_requested = 12;
		OpenStoreRequested open_store_requested = 13;
		PurchaseRequested purchase_requested = 14;
		SellItemRequested sell_item_requested = 15;
		RepairItemRequested repair_item_requested = 16;
		RechargeItemRequested recharge_item_requested = 17;
		IdentifyItemRequested identify_item_requested = 18;
		MoveInventoryItemRequested move_inventory_item_requested = 19;
		RefillManaRequested refill_mana_requested = 20;
		MoveItemRequested move_item_requested = 21;
		UsePortalRequested use_portal_requested = 22;
		PickupWorldItemRequested pickup_world_item_requested = 23;
		OperateObjectRequested operate_object_requested = 24;
		AdvanceQuestRequested advance_quest_requested = 25;
		SetFriendlyModeRequested set_friendly_mode_requested = 26;
		RestartTownRequested restart_town_requested = 27;
		DropHeldItemRequested drop_held_item_requested = 28;
		DisarmTrapRequested disarm_trap_requested = 29;
		TalkToQuestRequested talk_to_quest_requested = 30;
		ReadBookRequested read_book_requested = 31;
	AutoEquipItemRequested auto_equip_item_requested = 32;
	UseConsumableRequested use_consumable_requested = 33;
	TurnInQuestRequested turn_in_quest_requested = 34;
	AllocateAttributeRequested allocate_attribute_requested = 35;
		CloseStoreRequested close_store_requested = 36;
		OpenStashRequested open_stash_requested = 37;
		CloseStashRequested close_stash_requested = 38;
		DepositStashGoldRequested deposit_stash_gold_requested = 39;
		WithdrawStashGoldRequested withdraw_stash_gold_requested = 40;
		SplitGoldRequested split_gold_requested = 41;
		SortInventoryRequested sort_inventory_requested = 42;
		DropItemRequested drop_item_requested = 43;
		TalkToTownerRequested talk_to_towner_requested = 44;
	}
}

message MoveRequested {
	int32 direction_x = 1;
	int32 direction_y = 2;
	// Additive target-cell movement preserves native CMD_WALKXY auto-pathing;
	// zero-valued direction fields remain the original one-step intent.
	int32 target_x = 3;
	int32 target_y = 4;
	bool target_cell = 5;
}

message RestartTownRequested {}

message AttackRequested {
	uint32 target_entity_id = 1;
	// Additive cell-targeted attack. A true cell target preserves the native
	// CMD_SATTACKXY/CMD_RATTACKXY destination semantics; zero-valued entity
	// attacks remain the original entity-targeted command.
	int32 target_x = 2;
	int32 target_y = 3;
	bool target_cell = 4;
}

message CastRequested {
	uint32 spell_id = 1;
	uint32 target_entity_id = 2;
	int32 target_x = 3;
	int32 target_y = 4;
	// Zero preserves additive compatibility: the server infers a deterministic
	// source only from authoritative player state. Item-backed casts name the
	// exact item to consume or decrement.
	CastSourceKind source = 5;
	PlayerItemReference source_item = 6;
}

enum CastSourceKind {
	CAST_SOURCE_KIND_UNSPECIFIED = 0;
	CAST_SOURCE_KIND_ABILITY = 1;
	CAST_SOURCE_KIND_MEMORIZED_SPELL = 2;
	CAST_SOURCE_KIND_CHARGED_ITEM = 3;
	CAST_SOURCE_KIND_CONSUMABLE_ITEM = 4;
}

// Presentation hint for selecting an optional stable target entity. The
// server still validates the target kind, range, visibility, and effect.
enum SpellTargetingKind {
	SPELL_TARGETING_KIND_UNSPECIFIED = 0;
	SPELL_TARGETING_KIND_TILE = 1;
	SPELL_TARGETING_KIND_PLAYER = 2;
	SPELL_TARGETING_KIND_COMBAT_ENTITY = 3;
	SPELL_TARGETING_KIND_WORLD_ENTITY = 4;
}

message OpenStoreRequested {
	uint32 store_id = 1;
}

message CloseStoreRequested {}

message OpenStashRequested {}

message CloseStashRequested {}

message DepositStashGoldRequested {
	uint32 amount = 1;
}

message WithdrawStashGoldRequested {
	uint32 amount = 1;
}

message SplitGoldRequested {
	// Gold stack in the player's inventory or belt to split onto the cursor.
	PlayerItemReference item = 1;
	uint32 amount = 2;
}

message SortInventoryRequested {}

message PurchaseRequested {
	uint32 store_id = 1;
	uint32 store_slot = 2;
}

message SellItemRequested {
	uint32 inventory_index = 1;
	PlayerItemReference item = 2;
}

message RepairItemRequested {
	uint32 inventory_index = 1;
	PlayerItemReference item = 2;
	// Zero preserves paid vendor repair. Class ability requests are validated
	// against the player's authoritative loadout.
	ItemServiceSourceKind source = 3;
}

message RechargeItemRequested {
	uint32 inventory_index = 1;
	PlayerItemReference item = 2;
	// Zero preserves paid vendor recharge. Class ability requests are validated
	// against the player's authoritative loadout.
	ItemServiceSourceKind source = 3;
}

message IdentifyItemRequested {
	uint32 inventory_index = 1;
	PlayerItemReference item = 2;
	// Zero preserves the existing paid vendor-service behavior. Class ability
	// requests are validated against the player's authoritative loadout.
	ItemServiceSourceKind source = 3;
	// Consumable item service requests identify the source scroll explicitly.
	PlayerItemReference source_item = 4;
}

message ReadBookRequested {
	uint32 inventory_index = 1;
	PlayerItemReference item = 2;
}

enum ItemServiceSourceKind {
	ITEM_SERVICE_SOURCE_KIND_UNSPECIFIED = 0;
	ITEM_SERVICE_SOURCE_KIND_CLASS_ABILITY = 1;
	ITEM_SERVICE_SOURCE_KIND_CONSUMABLE_ITEM = 2;
}

message MoveInventoryItemRequested {
	uint32 inventory_index = 1;
	uint32 target_cell = 2;
	// Optional stable identity for stale-slot protection; zero-valued references
	// preserve compatibility with older clients and snapshots.
	PlayerItemReference item = 3;
}

message RefillManaRequested {}

// Explicit source/destination transfer. Inventory destinations use slot as
// the target grid cell; belt and equipment destinations use their slot.
message MoveItemRequested {
	PlayerItemReference item = 1;
	PlayerItemReference destination = 2;
}

// Atomically equips an inventory item and returns displaced equipment to the
// authoritative inventory using native placement order.
message AutoEquipItemRequested {
	PlayerItemReference item = 1;
	// When present, preserve the equipment slot selected by an explicit native
	// inventory drag. Automatic placement omits this field and lets the server
	// apply the native first-fit policy.
	optional uint32 equipment_slot = 2;
}

// Consumes a server-classified item action from inventory or belt. The stable
// item reference prevents a stale slot from consuming a different item.
message UseConsumableRequested {
	PlayerItemReference item = 1;
	// Optional equipment/inventory target for cursor-based oil actions.
	PlayerItemReference target_item = 2;
}

message UsePortalRequested {
	uint32 portal_id = 1;
}

message PickupWorldItemRequested {
	uint32 item_entity_id = 1;
}

message DropHeldItemRequested {
	int32 target_x = 1;
	int32 target_y = 2;
}

// Explicitly drops one stable-referenced carried item into an adjacent world
// cell. The legacy DropHeldItemRequested command remains the native cursor
// compatibility path and does not require an item reference.
message DropItemRequested {
	PlayerItemReference item = 1;
	int32 target_x = 2;
	int32 target_y = 3;
}

message OperateObjectRequested {
	uint32 object_entity_id = 1;
}

message DisarmTrapRequested {
	uint32 object_entity_id = 1;
}

message AdvanceQuestRequested {
	uint32 quest_id = 1;
}

message TalkToQuestRequested {
	uint32 quest_id = 1;
	uint32 target_entity_id = 2;
}

message TurnInQuestRequested {
	uint32 quest_id = 1;
	uint32 towner_id = 2;
}

/** Requests the presentation-only greeting for a connected native towner. */
message TalkToTownerRequested {
	uint32 towner_id = 1;
}

enum GameDifficulty {
	GAME_DIFFICULTY_UNSPECIFIED = 0;
	GAME_DIFFICULTY_NORMAL = 1;
	GAME_DIFFICULTY_NIGHTMARE = 2;
	GAME_DIFFICULTY_HELL = 3;
}

// Explicit state, rather than a toggle, keeps retries idempotent.
message SetFriendlyModeRequested {
	bool friendly_mode = 1;
}

/** Spends server-owned level-up points on one native primary attribute. */
message AllocateAttributeRequested {
	PlayerAttribute attribute = 1;
	uint32 amount = 2;
}

enum PlayerAttribute {
	PLAYER_ATTRIBUTE_UNSPECIFIED = 0;
	PLAYER_ATTRIBUTE_STRENGTH = 1;
	PLAYER_ATTRIBUTE_MAGIC = 2;
	PLAYER_ATTRIBUTE_DEXTERITY = 3;
	PLAYER_ATTRIBUTE_VITALITY = 4;
}

message PlayerItemReference {
	PlayerItemLocation location = 1;
	uint32 slot = 2;
	// Optional stable content identity for stale-slot protection; zero preserves
	// compatibility with older clients and legacy snapshots.
	uint32 stable_item_id = 3;
	// Stash references use the page field; other locations leave it zero.
	uint32 page = 4;
}

enum PlayerItemLocation {
	PLAYER_ITEM_LOCATION_INVENTORY = 0;
	PLAYER_ITEM_LOCATION_BELT = 1;
	PLAYER_ITEM_LOCATION_EQUIPMENT = 2;
	PLAYER_ITEM_LOCATION_STASH = 3;
}

message CommandAck {
	repeated CommandResult results = 1;
}

message CommandResult {
	uint64 client_sequence = 1;
	uint64 server_receipt_sequence = 2;
	uint64 applied_tick = 3;
	CommandStatus status = 4;
	CommandRejectReason reject_reason = 5;
}

enum CommandStatus {
	COMMAND_STATUS_UNSPECIFIED = 0;
	COMMAND_STATUS_ACCEPTED = 1;
	COMMAND_STATUS_REJECTED = 2;
	COMMAND_STATUS_RESCHEDULED = 3;
	COMMAND_STATUS_DUPLICATE = 4;
}

enum CommandRejectReason {
	COMMAND_REJECT_REASON_UNSPECIFIED = 0;
	COMMAND_REJECT_REASON_MALFORMED = 1;
	COMMAND_REJECT_REASON_TOO_LATE = 2;
	COMMAND_REJECT_REASON_NOT_ALLOWED = 3;
	COMMAND_REJECT_REASON_INVALID_TARGET = 4;
	COMMAND_REJECT_REASON_INSUFFICIENT_RESOURCES = 5;
}

message Snapshot {
	uint64 tick = 1;
	string state_sha256 = 2;
	repeated PlayerSnapshot players = 3;
	// Present when the receiving session has an active store. This is the
	// authoritative remaining vendor stock after every accepted command.
	StoreSnapshot active_store = 4;
	// Authoritative combat entities visible in the current world snapshot.
	repeated MonsterSnapshot monsters = 5;
	repeated WorldItemSnapshot world_items = 6;
	repeated ObjectSnapshot objects = 7;
	repeated QuestSnapshot quests = 8;
	repeated ProjectileSnapshot projectiles = 9;
	// Current state of the module-owned native-compatible gameplay RNG.
	uint32 random_state = 10;
	// Dynamic and external authoritative portal routes.
	repeated PortalSnapshot portals = 11;
	// Defeated non-minion monster tiles used by corpse-consuming AI.
	repeated CorpseSnapshot corpses = 12;
	// Effective authoritative geometry for presentation clients.
	repeated LevelGeometrySnapshot level_geometry = 13;
	// Native-compatible terminal Diablo defeat state.
	bool victory_triggered = 14;
	// Native difficulty selected for the authoritative session.
	GameDifficulty difficulty = 15;
	// Additive content-owned quest/towner interaction stages.
	repeated QuestTownerInteractionSnapshot quest_towner_interactions = 16;
	// Active content-backed geometry mutations persisted by the server.
	repeated uint32 active_world_mutation_ids = 17;
	// Runtime-generated set-piece origins persisted by the server.
	repeated SetLevelObjectOriginSnapshot set_level_object_origins = 18;
	// Procedural encounter levels that have already been materialized.
	repeated uint32 materialized_procedural_level_ids = 19;
	// Active content identity stamped by the generic host for live replacement
	// visibility. These fields are transport metadata and are excluded from the
	// canonical gameplay state hash.
	string content_manifest_hash = 20;
	string ruleset_identity_hash = 21;
	// Additive content-owned general towner greeting metadata.
	repeated TownerGreetingSnapshot towner_greetings = 22;
	// Runtime-generated ordinary-level quest-piece origins persisted by the server.
	repeated ProceduralQuestPieceOriginSnapshot procedural_quest_piece_origins = 23;
}

message SetLevelObjectOriginSnapshot {
	int32 set_level_id = 1;
	uint32 level_id = 2;
	int32 position_x = 3;
	int32 position_y = 4;
}

message ProceduralQuestPieceOriginSnapshot {
	uint32 origin_id = 1;
	uint32 level_id = 2;
	int32 position_x = 3;
	int32 position_y = 4;
}

message LevelGeometrySnapshot {
	uint32 level_id = 1;
	int32 width = 2;
	int32 height = 3;
	repeated int32 blocked_cells = 4;
	repeated int32 missile_blocked_cells = 5;
	// Native d-piece transparency signed-byte values encoded as their low wire byte.
	repeated uint32 native_transparency = 6;
	// Authored level triggers for presentation-only progression markers.
	repeated WarpTriggerSnapshot warp_triggers = 7;
	// Raw DUN object-layer conversion indices after authoritative world
	// mutations (0 through native DUN_OBJECT_ID_LAST, currently 146).
	repeated uint32 native_object_layer = 8;
	// Native mega-tile IDs after authoritative content composition.
	repeated uint32 native_mega_tile_layer = 9;
	// Native d-piece IDs after authoritative world mutations (0 through MAXTILES-1, currently 1378).
	repeated uint32 native_piece_layer = 10;
	// Derived native vision blockers, including DUN BlockLight pieces.
	repeated int32 native_vision_blocked_cells = 11;
	// Raw DUN monster-layer conversion indices after authoritative composition (0 through 157).
	repeated uint32 native_monster_layer = 12;
	// Collision-only static-object cells; intentionally excluded from native vision/LOS.
	repeated int32 static_object_blocked_cells = 13;
	// Raw native special bytes after authoritative composition; optional full fine-grid layer.
	repeated uint32 native_special_layer = 14;
}

message WarpTriggerSnapshot {
	uint32 warp_id = 1;
	int32 trigger_x = 2;
	int32 trigger_y = 3;
	uint32 target_level_id = 4;
	int32 target_x = 5;
	int32 target_y = 6;
	uint32 required_quest_id = 7;
	bool required_quest_completed = 8;
	string stable_symbol = 9;
	bool available = 10;
}

message CorpseSnapshot {
	uint32 entity_id = 1;
	uint32 level_id = 2;
	int32 position_x = 3;
	int32 position_y = 4;
}

message PortalSnapshot {
	uint32 portal_id = 1;
	uint32 source_level_id = 2;
	int32 source_position_x = 3;
	int32 source_position_y = 4;
	uint32 destination_level_id = 5;
	int32 destination_position_x = 6;
	int32 destination_position_y = 7;
	uint32 remaining_ticks = 8;
	uint32 owner_entity_id = 9;
	bool bidirectional = 10;
}

message StoreServicesSnapshot {
	bool repair = 1;
	bool recharge = 2;
	bool identify = 3;
	bool refill_mana = 4;
}

// Unspecified means the quoted price is currently payable, including zero.
// InsufficientResources retains the calculated price; other failures use zero.
message StoreServicePriceQuote {
	uint32 price = 1;
	CommandRejectReason reject_reason = 2;
}

message StoreItemServiceQuotes {
	PlayerItemReference item = 1;
	StoreServicePriceQuote repair = 2;
	StoreServicePriceQuote recharge = 3;
	StoreServicePriceQuote identify = 4;
}

message StoreServiceQuotesSnapshot {
	repeated StoreItemServiceQuotes items = 1;
	StoreServicePriceQuote refill_mana = 2;
}

message StoreSnapshot {
	uint32 store_id = 1;
	repeated StoreItemSnapshot items = 2;
	StoreServicesSnapshot services = 3;
	// Informational live-only prices; omitted from persistence snapshots.
	StoreServiceQuotesSnapshot quotes = 4;
}

message StoreItemSnapshot {
	uint32 store_slot = 1;
	uint32 item_seed = 2;
	uint32 price = 3;
	ItemStateSnapshot state = 4;
}

message PlayerSnapshot {
	uint32 entity_id = 1;
	int32 position_x = 2;
	int32 position_y = 3;
	int32 life = 4;
	int32 mana = 5;
	uint32 gold = 6;
	// Zero means that the player has no active store.
	uint32 active_store_id = 7;
	repeated ItemSnapshot inventory = 8;
	uint32 experience = 9;
	PlayerAttributesSnapshot attributes = 10;
	repeated EquippedItemSnapshot equipment = 11;
	repeated int32 inventory_grid = 12;
	repeated BeltItemSnapshot belt = 13;
	int32 mana_maximum = 14;
	int32 life_maximum = 15;
	uint32 character_level = 16;
	repeated StatusEffectSnapshot status_effects = 17;
	uint32 level_id = 18;
	// Stable ID from the active gameplay module's external class catalog.
	uint32 character_class_id = 19;
	// Native-compatible class skill and learned spell levels. Zero ability means
	// no class skill; learned spell IDs and levels are always non-zero.
	uint32 ability_spell_id = 20;
	repeated PlayerSpellLevelSnapshot memorized_spells = 21;
	// False is the native default friendly mode, preserving additive compatibility.
	bool hostile_mode = 22;
	// Server-owned native action mode and its first inactive tick. Stand/zero
	// preserve additive compatibility with snapshots written before these fields.
	PlayerCombatMode combat_mode = 23;
	uint64 combat_mode_end_tick = 24;
	// Complete in-progress action state. Absence preserves compatibility with
	// snapshots created before authoritative animation-frame scheduling.
	PlayerActionSnapshot current_action = 25;
	// Item carried by the presentation cursor. It is not part of inventory Gold.
	ItemSnapshot held_item = 26;
	// Native eight-way facing, owned by the authoritative simulation.
	PlayerDirection facing_direction = 27;
	// Native-compatible character identity, owned and persisted by the server.
	string character_name = 28;
	// Persistent server-owned native Mana Shield defense state.
	bool mana_shield_active = 29;
	// Native-compatible remaining Reflect charges. Zero preserves legacy snapshots.
	uint32 reflect_charges = 30;
	// Unmodified native maxima used to derive Hellfire equipment conversions.
	// Zero falls back to the corresponding effective maximum for legacy snapshots.
	int32 base_mana_maximum = 31;
	int32 base_life_maximum = 32;
	// Semantic class-skill role supplied by the active content loadout.
	PlayerAbilityKind ability_kind = 33;
	// Native persistent hero rank set after a single-player Diablo defeat.
	uint32 diablo_kill_level = 34;
	// Server-owned native _pLvlVisited flags, keyed by authored level ID.
	repeated uint32 visited_level_ids = 35;
	// Server-owned native level-up points available for primary attributes.
	uint32 stat_points = 36;
	// Additive targeting metadata for the selected class ability.
	SpellTargetingKind ability_targeting_kind = 37;
	// Server-owned stash projection. Each page is a native-compatible 10x10 grid.
	repeated StashItemSnapshot stash = 38;
	uint32 stash_gold = 39;
	bool stash_open = 40;
	// Native-clamped player vision radius derived from identified equipment.
	// Zero preserves compatibility with snapshots written before this field.
	int32 light_radius = 41;
}

message StashItemSnapshot {
	uint32 page = 1;
	uint32 cell = 2;
	ItemSnapshot item = 3;
}

enum PlayerDirection {
	PLAYER_DIRECTION_SOUTH = 0;
	PLAYER_DIRECTION_SOUTH_WEST = 1;
	PLAYER_DIRECTION_WEST = 2;
	PLAYER_DIRECTION_NORTH_WEST = 3;
	PLAYER_DIRECTION_NORTH = 4;
	PLAYER_DIRECTION_NORTH_EAST = 5;
	PLAYER_DIRECTION_EAST = 6;
	PLAYER_DIRECTION_SOUTH_EAST = 7;
}

enum PlayerCombatMode {
	PLAYER_COMBAT_MODE_STAND = 0;
	PLAYER_COMBAT_MODE_WALK_NORTHWARDS = 1;
	PLAYER_COMBAT_MODE_WALK_SOUTHWARDS = 2;
	PLAYER_COMBAT_MODE_WALK_SIDEWAYS = 3;
	PLAYER_COMBAT_MODE_ATTACK = 4;
	PLAYER_COMBAT_MODE_RANGED_ATTACK = 5;
	PLAYER_COMBAT_MODE_BLOCK = 6;
	PLAYER_COMBAT_MODE_GOT_HIT = 7;
	PLAYER_COMBAT_MODE_DEATH = 8;
	PLAYER_COMBAT_MODE_SPELL = 9;
	PLAYER_COMBAT_MODE_NEW_LEVEL = 10;
	PLAYER_COMBAT_MODE_QUIT = 11;
}

enum PlayerActionKind {
	PLAYER_ACTION_KIND_UNSPECIFIED = 0;
	PLAYER_ACTION_KIND_MOVE = 1;
	PLAYER_ACTION_KIND_ATTACK = 2;
	PLAYER_ACTION_KIND_CAST = 3;
	PLAYER_ACTION_KIND_DEATH = 4;
	PLAYER_ACTION_KIND_LEVEL_TRANSITION = 5;
	PLAYER_ACTION_KIND_RESTART_TOWN = 6;
}

message PlayerActionSnapshot {
	PlayerActionKind kind = 1;
	uint64 started_at_tick = 2;
	uint64 effect_tick = 3;
	uint64 ready_tick = 4;
	uint64 end_tick = 5;
	bool effect_applied = 6;
