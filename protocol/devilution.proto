	int32 position_y = 4;
	bool deleted = 5;
	bool identified = 6;
	int32 magical = 7;
	int32 equip_location = 8;
	int32 item_class = 9;
	int32 value = 10;
	int32 identified_value = 11;
	int32 min_damage = 12;
	int32 max_damage = 13;
	int32 armor_class = 14;
	uint32 flags = 15;
	int32 misc_id = 16;
	int32 spell_id = 17;
	int32 item_index = 18;
	int32 charges = 19;
	int32 max_charges = 20;
	int32 durability = 21;
	int32 max_durability = 22;
	int32 plus_damage = 23;
	int32 plus_to_hit = 24;
	int32 plus_armor_class = 25;
	int32 plus_strength = 26;
	int32 plus_magic = 27;
	int32 plus_dexterity = 28;
	int32 plus_vitality = 29;
	int32 plus_fire_resistance = 30;
	int32 plus_lightning_resistance = 31;
	int32 plus_magic_resistance = 32;
	int32 plus_mana = 33;
	int32 plus_hit_points = 34;
	int32 plus_damage_modifier = 35;
	int32 plus_get_hit = 36;
	int32 plus_light = 37;
	int32 spell_level_add = 38;
	int32 unique_id = 39;
	int32 fire_min_damage = 40;
	int32 fire_max_damage = 41;
	int32 lightning_min_damage = 42;
	int32 lightning_max_damage = 43;
	int32 plus_enemy_armor_class = 44;
	int32 prefix_power = 45;
	int32 suffix_power = 46;
	int32 value_add_1 = 47;
	int32 value_multiply_1 = 48;
	int32 value_add_2 = 49;
	int32 value_multiply_2 = 50;
	int32 minimum_strength = 51;
	int32 minimum_magic = 52;
	int32 minimum_dexterity = 53;
	bool stat_flag = 54;
	int32 hellfire_damage_armor_flags = 55;
	uint32 buff = 56;
	// Inventory footprint in grid cells. Missing values retain the legacy
	// one-cell default for older clients and content tables.
	uint32 inventory_width = 57;
	uint32 inventory_height = 58;
	// Runtime-authored presentation identity for dynamic items such as PvP ears.
	string base_name = 59;
	string identified_name = 60;
	optional int32 native_cursor_graphic = 61;
	// Native Hellfire percentage of base mana converted into life on equip.
	int32 mana_to_life_percent = 62;
	// Native Hellfire percentage of base life converted into mana on equip.
	int32 life_to_mana_percent = 63;
	ItemSpellSourceKind spell_source_kind = 64;
	ItemActionKind item_action_kind = 65;
	// Optional server-owned spell presentation metadata for item-backed sources.
	string spell_display_name = 66;
	// Additive server-owned world-item presentation family; zero preserves the
	// generic legacy rendering path.
	ItemPresentationKind presentation_kind = 67;
	// Stable authoritative content identity; zero preserves legacy snapshots.
	uint32 stable_item_id = 68;
	// Additive targeting metadata for item-backed spell sources.
	SpellTargetingKind spell_targeting_kind = 69;
}

enum ItemPresentationKind {
	ITEM_PRESENTATION_KIND_UNSPECIFIED = 0;
	ITEM_PRESENTATION_KIND_GENERIC = 1;
	ITEM_PRESENTATION_KIND_GOLD = 2;
	ITEM_PRESENTATION_KIND_EAR = 3;
}

message PlayerAttributesSnapshot {
	AttributeSnapshot strength = 1;
	AttributeSnapshot magic = 2;
	AttributeSnapshot dexterity = 3;
	AttributeSnapshot vitality = 4;
}

message AttributeSnapshot {
	int32 base = 1;
	int32 current = 2;
}

message EquippedItemSnapshot {
	uint32 slot = 1;
	uint32 item_seed = 2;
	ItemStateSnapshot state = 3;
}

message BeltItemSnapshot {
	uint32 slot = 1;
	uint32 item_seed = 2;
	ItemStateSnapshot state = 3;
}

message EventBatch {
	uint64 tick = 1;
	repeated GameEvent events = 2;
}

message GameEvent {
	oneof event {
		DamageEvent damage = 10;
		ExperienceEvent experience = 11;
		HealingEvent healing = 12;
		DialogueEvent dialogue = 13;
		VictoryEvent victory = 14;
		MapOpenedEvent map_opened = 15;
	}
}

/** Content-owned native location and message identity for a general greeting. */
message TownerGreetingSnapshot {
	int32 towner_id = 1;
	uint32 level_id = 2;
	int32 position_x = 3;
	int32 position_y = 4;
	int32 message_id = 5;
}

message DamageEvent {
	uint32 source_entity_id = 1;
	uint32 target_entity_id = 2;
	int32 amount = 3;
	// Exact native-compatible 26.6 damage; amount remains a legacy projection.
	int32 amount_q6 = 4;
}

message ExperienceEvent {
	uint32 player_entity_id = 1;
	uint32 amount = 2;
}

message HealingEvent {
	uint32 target_entity_id = 1;
	// Legacy native-resource amount retained for readers predating amount_q6.
	int32 amount = 2;
	// Exact authoritative healing in native Q6 resource units.
	int32 amount_q6 = 3;
}

message DialogueEvent {
	uint32 source_entity_id = 1;
	uint32 target_entity_id = 2;
	uint32 quest_id = 3;
	int32 message_id = 4;
	// Optional server-owned localized text; empty preserves ID-only compatibility.
	string text = 5;
}

// Server-owned native Diablo defeat boundary. The rank is zero for
// multiplayer sessions, where the native single-player hero rank is absent.
message VictoryEvent {
	uint32 player_entity_id = 1;
	uint32 boss_entity_id = 2;
	uint32 diablo_kill_level = 3;
}

// Transient presentation event for the native Cathedral Map item. The map
// remains an owned item; the server only authorizes opening its modal view.
message MapOpenedEvent {
	uint32 player_entity_id = 1;
}

message ProtocolError {
	ProtocolErrorCode code = 1;
	string detail = 2;
}

enum ProtocolErrorCode {
	PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
	PROTOCOL_ERROR_CODE_UNSUPPORTED_SCHEMA = 1;
	PROTOCOL_ERROR_CODE_CONTENT_MISMATCH = 2;
	PROTOCOL_ERROR_CODE_NOT_AUTHENTICATED = 3;
	PROTOCOL_ERROR_CODE_INVALID_MESSAGE = 4;
}
